[project]
name = "sqlcl-releases"
version = "1.0.0"
description = "Metadata-only release registry automation for Oracle SQLcl."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "dateparser",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
markers = [
    "network: tests that call Oracle or GitHub",
]

[tool.ruff]
line-length = 120
src = ["scripts", "tests"]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["B", "I", "SIM", "UP"]
